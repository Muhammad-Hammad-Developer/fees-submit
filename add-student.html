<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - AUJ School Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            z-index: 0;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        header h1 {
            color: #333;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            flex: 1;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #667eea;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .form-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            max-width: 700px;
            margin: 30px auto;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        form h2 {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input, select {
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f8f9fa;
            font-family: inherit;
            width: 100%;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        select {
            cursor: pointer;
        }

        button[type="submit"] {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .success-message {
            grid-column: 1 / -1;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid #28a745;
            display: none;
            margin-top: 10px;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #overlayBox {
            background: white;
            padding: 40px 50px;
            border-radius: 20px;
            text-align: center;
            font-family: inherit;
            font-size: 18px;
            color: #333;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.4s ease;
            max-width: 400px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .blurred {
            filter: blur(5px);
            pointer-events: none;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 15px;
                gap: 15px;
            }

            .form-container {
                padding: 25px 20px;
                margin: 20px;
            }

            form {
                grid-template-columns: 1fr;
            }

            form h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="background-animation"></div>
    
    <header>
        <h1>Add New Student</h1>
        <nav class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="new.html">New Admission</a>
        </nav>
    </header>

    <div class="form-container">
        <form id="submitForm">
            <h2>➕ Add Student</h2>
            
            <div class="form-group">
                <label for="studentName">👤 Student Name</label>
                <input type="text" id="studentName" name="StudentName" required>
            </div>

            <div class="form-group">
                <label for="fatherName">👨‍👦 Father's Name</label>
                <input type="text" id="fatherName" name="FatherName" required>
            </div>

            <div class="form-group">
                <label for="grNumber">📅 GR NUMBER</label>
                <input type="number" id="grNumber" name="GRNumber" required>
            </div>

            <div class="form-group">
                <label for="phone">📱 Phone Number</label>
                <input type="tel" id="phone" name="PhoneNumber" required>
            </div>

            <div class="form-group full-width">
                <label for="class">📚 Class</label>
                <select id="class" name="Class" required>
                    <option value="">Select a class</option>
                    <option>Play Group</option>
                    <option>Mont</option>
                    <option>Prep 1</option>
                    <option>Prep 2</option>
                    <option>1st</option>
                    <option>2nd</option>
                    <option>3rd</option>
                    <option>4th</option>
                    <option>5th</option>
                    <option>6th</option>
                    <option>7th</option>
                    <option>8th</option>
                    <option>CIT </option>
                    <option>WEB DEVELOPMENT</option>
                    <option>GRAPHICS DESIGN</option>
                </select>
            </div>

            <div class="form-group">
                <label for="address">🏠 Address</label>
                <input type="text" id="address" name="Address" required>
            </div>

            <div class="form-group">
                <label for="email">📧 Email (Optional)</label>
                <input type="email" id="email" name="Email">
            </div>

            <button type="submit" id="submitButton">Add Student</button>
        </form>
    </div>

    <script src="student.js"></script>
</body>
</html>
