<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AUJ Fees Management System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    .background-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      z-index: 0;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 25px 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      position: relative;
      z-index: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    header h1 {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .menu-toggle {
      display: none;
      font-size: 24px;
      cursor: pointer;
      color: #667eea;
    }

    /* ---- Main Container ---- */
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 40px;
      margin-top: 80px;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
      min-height: calc(100vh - 150px);
    }

    .login-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 420px;
      text-align: center;
      animation: fadeInUp 0.6s ease-out;
      position: relative;
      z-index: 1;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {
      margin-bottom: 30px;
    }

    .login-icon {
      font-size: 48px;
      margin-bottom: 15px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .login-container h2 {
      color: #333;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-header p {
      color: #666;
      font-size: 14px;
      margin-top: 5px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .input-group {
      text-align: left;
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }

    .label-icon {
      font-size: 16px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 15px;
      transition: all 0.3s ease;
      background: #f8f9fa;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
      transform: translateY(-2px);
    }

    input::placeholder {
      color: #999;
    }

    .login-button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s ease;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      position: relative;
      overflow: hidden;
    }

    .login-button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .login-button:hover::before {
      width: 300px;
      height: 300px;
    }

    .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .login-button.success {
      background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
    }

    .button-arrow {
      transition: transform 0.3s ease;
    }

    .login-button:hover .button-arrow {
      transform: translateX(5px);
    }

    .error-message {
      color: #e74c3c;
      margin-top: 10px;
      font-size: 14px;
      padding: 12px;
      background: #fee;
      border-radius: 8px;
      border-left: 4px solid #e74c3c;
      display: none;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
      20%, 40%, 60%, 80% { transform: translateX(10px); }
    }

    .login-container.shake {
      animation: shake 0.5s;
    }

    @media (max-width: 768px) {
      header {
        padding: 20px;
      }

      header h1 {
        font-size: 24px;
      }

      .container {
        margin-top: 40px;
        gap: 30px;
        padding: 20px;
      }

      .login-container {
        padding: 30px 20px;
        margin: 20px;
        border-radius: 16px;
      }

      .login-container h2 {
        font-size: 24px;
      }

      .login-icon {
        font-size: 40px;
      }
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 20px;
      }

      .login-container {
        padding: 25px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="background-animation"></div>
  
  <header>
    <h1>AUJ Management System</h1>
    <div class="menu-toggle" id="mobile-menu">&#9776;</div>
  </header>

  <div class="container">
    <div class="login-container">
      <div class="login-header">
        <div class="login-icon">🔐</div>
        <h2>Welcome Back</h2>
        <p>Sign in to access AUJ School Management System</p>
      </div>
      
      <form id="loginForm">
        <div class="input-group">
          <label for="username">
            <span class="label-icon">👤</span>
            Username
          </label>
          <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username">
        </div>

        <div class="input-group">
          <label for="password">
            <span class="label-icon">🔒</span>
            Password
          </label>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
        </div>

        <button type="button" onclick="validateForm()" class="login-button">
          <span>Login</span>
          <span class="button-arrow">→</span>
        </button>

        <p class="error-message" id="errorMessage"></p>
      </form>
    </div>
  </div>

  <script>
    function validateForm(){
      var name = document.getElementById("username").value;
      var password = document.getElementById("password").value;
      var errorMessage = document.getElementById("errorMessage");

      // Clear previous error
      errorMessage.textContent = "";
      errorMessage.style.display = "none";

      if(name == "admin" && password == "Raza123"){
        // Show success feedback
        document.querySelector('.login-button').classList.add('success');
        setTimeout(function(){
          window.location.assign("dashboard.html");
        }, 500);
      }
      else{
        // Show error message
        errorMessage.textContent = "Invalid username or password. Please try again.";
        errorMessage.style.display = "block";
        
        // Add shake animation
        document.querySelector('.login-container').classList.add('shake');
        setTimeout(function(){
          document.querySelector('.login-container').classList.remove('shake');
        }, 500);
      }
      return;
    }

    // Add Enter key support
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          validateForm();
        }
      });
    });
  </script>
</body>
</html>
