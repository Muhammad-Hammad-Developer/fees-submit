<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Submit Form</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #333;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      padding: 10px 30px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    header h1 {
      font-size: 28px;
      font-weight: bold;
      color: #1b1b1b;
      text-align: center;
      flex: 1;
    }

    .menu-toggle {
      display: none;
      font-size: 24px;
      cursor: pointer;
    }

    /* ---- Main Container ---- */
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 30px;
      margin-top: 50px;
      padding: 20px;
    }

    /* ---- Box Design ---- */
    .box {
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 350px;
      padding: 30px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .box:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }

    .box h2 {
      color: #0a4275;
      margin-bottom: 15px;
    }

    .btn {
      background-color: #0a4275;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #072e52;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        text-align: center;
      }
      header h1 {
        font-size: 22px;
      }
      .container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
   
    <h1>AUJ FEES MANAGMENT SYSTEM</h1>
    <div class="menu-toggle" id="mobile-menu">&#9776;</div>
  </header>

  <div class="container">
    <div class="box">
      <h2>School Fees System Form</h2>
      <p>Manage and record school fee details here.</p>
     <a href="school.html"><button class="btn">Open Form</button></a> 
    </div>

    <div class="box">
      <h2>Computer System Form</h2>
      <p>Fill in details for computer course enrollments.</p>
     <a href="main.html"> <button class="btn">Open Form</button></a>
    </div>
  </div>

 
</body>
</html>
