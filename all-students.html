<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Students - AUJ School Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            z-index: 0;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        header h1 {
            color: #333;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            flex: 1;
        }

        .back-btn {
            text-decoration: none;
            color: #667eea;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-btn:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        .page-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            animation: fadeInUp 0.6s ease-out;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-header h2 {
            font-size: 32px;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .add-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .students-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeInUp 0.6s ease-out;
            animation-delay: 0.2s;
            animation-fill-mode: both;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 24px;
            color: #666;
            margin-bottom: 10px;
        }

        .empty-state p {
            margin-bottom: 30px;
        }

        .students-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .students-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .students-table td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
        }

        .students-table tr:hover {
            background: #f8f9fa;
        }

        .students-table tr:last-child td {
            border-bottom: none;
        }

        .student-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .btn-edit, .btn-delete {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-edit {
            background: #4caf50;
            color: white;
        }

        .btn-edit:hover {
            background: #45a049;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 15px;
                gap: 15px;
            }

            .page-header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .students-container {
                padding: 20px;
                overflow-x: auto;
            }

            .students-table {
                font-size: 12px;
            }

            .students-table th,
            .students-table td {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="background-animation"></div>
    
    <header>
        <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
        <h1>All Students</h1>
    </header>

    <div class="container">
        <div class="page-header">
            <h2>👥 All Students List</h2>
            <a href="add-student.html" class="add-btn">
                ➕ Add New Student
            </a>
        </div>

        <div class="students-container">
            <div id="studentsList">
                <div class="empty-state">
                    <div class="empty-state-icon">👤</div>
                    <h3>No Students Found</h3>
                    <p>Start by adding your first student to the system.</p>
                    <a href="add-student.html" class="add-btn">Add Student</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-IN', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
        }

        function loadAllStudents() {
            const students = JSON.parse(localStorage.getItem('students') || '[]');
            const studentsList = document.getElementById('studentsList');
            
            if (students.length === 0) {
                studentsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">👤</div>
                        <h3>No Students Found</h3>
                        <p>Start by adding your first student to the system.</p>
                        <a href="add-student.html" class="add-btn">Add Student</a>
                    </div>
                `;
                return;
            }
            
            let tableHTML = `
                <table class="students-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Student Name</th>
                            <th>Father's Name</th>
                            <th>Date of Birth</th>
                            <th>Class</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Address</th>
                            <th>Added Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            students.forEach((student, index) => {
                const addedDate = formatDate(student.addedDate);
                const dob = formatDate(student.dateOfBirth);
                
                tableHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${student.name || 'N/A'}</strong></td>
                        <td>${student.fatherName || 'N/A'}</td>
                        <td>${dob}</td>
                        <td><span class="student-badge">${student.class || 'N/A'}</span></td>
                        <td>${student.phone || 'N/A'}</td>
                        <td>${student.email || 'N/A'}</td>
                        <td>${student.address || 'N/A'}</td>
                        <td>${addedDate}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-edit" onclick="editStudent(${index})">Edit</button>
                                <button class="btn-delete" onclick="deleteStudent(${index})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            
            tableHTML += `
                    </tbody>
                </table>
            `;
            
            studentsList.innerHTML = tableHTML;
        }

        function deleteStudent(index) {
            if (confirm('Are you sure you want to delete this student?')) {
                const students = JSON.parse(localStorage.getItem('students') || '[]');
                students.splice(index, 1);
                localStorage.setItem('students', JSON.stringify(students));
                loadAllStudents();
                alert('Student deleted successfully!');
            }
        }

        function editStudent(index) {
            const students = JSON.parse(localStorage.getItem('students') || '[]');
            const student = students[index];
            
            // For now, just show an alert. You can create an edit page later
            alert(`Edit functionality for: ${student.name}\n\nThis feature can be added later.`);
        }

        // Load students when page loads
        document.addEventListener('DOMContentLoaded', loadAllStudents);
    </script>
</body>
</html>
