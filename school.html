<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fees Submit Form - AUJ Schooling System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            z-index: 0;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo img {
            max-width: 100px;
            height: auto;
        }

        header h1 {
            color: #333;
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            flex: 1;
            text-align: center;
        }

        .form-container1 {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            max-width: 700px;
            margin: 30px auto;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        form h2 {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input, select {
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f8f9fa;
            font-family: inherit;
            width: 100%;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        select {
            cursor: pointer;
        }

        button[type="submit"] {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .new-admission-btn {
            grid-column: 1 / -1;
            margin-top: 15px;
        }

        .new-admission-btn a {
            display: block;
            text-decoration: none;
        }

        .new-admission-btn button {
            width: 100%;
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }

        .new-admission-btn button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.5);
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #overlayBox {
            background: white;
            padding: 40px 50px;
            border-radius: 20px;
            text-align: center;
            font-family: inherit;
            font-size: 18px;
            color: #333;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.4s ease;
            max-width: 400px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .blurred {
            filter: blur(5px);
            pointer-events: none;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 10px 15px;
            }

            .logo img {
                max-width: 80px;
            }

            header h1 {
                font-size: 16px;
                margin-top: 8px;
            }

            .form-container1 {
                padding: 25px 20px;
                margin: 20px;
            }

            form {
                grid-template-columns: 1fr;
            }

            form h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="background-animation"></div>
    
    <header>
        <div class="logo">
            <img src="auj schooling.png" alt="AUJ Schooling Logo">
        </div>
        <h1>AUJ Schooling System</h1>
        <div class="menu-toggle" id="mobile-menu">&#9776;</div>
    </header>

    <div class="form-container1">
        <form id="submitForm">
            <h2>🏫 Fees Submit Form</h2>
            
            <div class="form-group">
                <label for="sno">📄 Slip Number</label>
                <input type="number" id="sno" name="SlipNo" required>
            </div>

            <div class="form-group">
                <label for="date">📅 Date</label>
                <input type="date" id="date" name="Date" required>
            </div>

            <div class="form-group">
                <label for="name">👤 Name</label>
                <input type="text" id="name" name="Name" required>
            </div>

            <div class="form-group">
                <label for="fatherName">👨‍👦 Father Name</label>
                <input type="text" id="fatherName" name="FatherName" required>
            </div>

            <div class="form-group full-width">
                <label for="course">📚 Classes</label>
                <select id="course" name="Course">
                    <option value="">Select a class</option>
                    <option>Play Group</option>
                    <option>Mont</option>
                    <option>Prep 1</option>
                    <option>Prep 2</option>
                    <option>1st</option>
                    <option>2nd</option>
                    <option>3rd</option>
                    <option>4th</option>
                    <option>5th</option>
                    <option>6th</option>
                    <option>7th</option>
                    <option>8th</option>
                    <option>Special class</option>
                </select>
            </div>

            <div class="form-group">
                <label for="AdmissionFee">💰 Admission Fee</label>
                <input type="number" id="AdmissionFee" name="AdmissionFee">
            </div>

            <div class="form-group">
                <label for="MonthlyFee">📊 Monthly Fee</label>
                <input type="number" id="MonthlyFee" name="MonthlyFee" required>
            </div>

            <div class="form-group">
                <label for="CertificateFee">📖 Course Fee</label>
                <input type="number" id="CertificateFee" name="CourseFee">
            </div>

            <div class="form-group">
                <label for="FatherNumber">📱 Father/Guardian's Phone</label>
                <input type="tel" id="FatherNumber" name="PhoneNumber">
            </div>

            <div class="form-group">
                <label for="TotalFee">💵 Total Fee</label>
                <input type="number" id="TotalFee" name="TotalFee" required>
            </div>

            <button type="submit" id="submitButton">Submit Form</button>
            
            <div class="new-admission-btn">
                <a href="new.html">
                    <button type="button">➕ New Admission</button>
                </a>
            </div>
        </form>
    </div>

    <script src="script2.js"></script>
</body>
</html>
