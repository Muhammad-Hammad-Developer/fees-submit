<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Admission Form - AUJ</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    padding: 20px;
  }

  .background-animation {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    z-index: 0;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .admission-form {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 450px;
    position: relative;
    z-index: 1;
    border: 1px solid rgba(255, 255, 255, 0.2);
    animation: fadeInUp 0.6s ease-out;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .admission-form h2 {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 30px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #333;
    font-size: 14px;
  }

  input {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    font-size: 15px;
    transition: all 0.3s ease;
    background: #f8f9fa;
    font-family: inherit;
  }

  input:focus {
    outline: none;
    border-color: #667eea;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    transform: translateY(-2px);
  }

  input::placeholder {
    color: #999;
  }

  button {
    width: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    padding: 16px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    margin-top: 10px;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
  }

  button:active {
    transform: translateY(0);
  }

  @media (max-width: 480px) {
    .admission-form {
      padding: 30px 25px;
    }

    .admission-form h2 {
      font-size: 24px;
    }
  }
</style>
</head>
<body>
  <div class="background-animation"></div>

  <form class="admission-form">
    <h2>➕ New Admission Form</h2>

    <div class="form-group">
      <label for="name">👤 Student Name</label>
      <input type="text" id="name" placeholder="Enter student name" required>
    </div>

    <div class="form-group">
      <label for="fatherName">👨‍👦 Father's Name</label>
      <input type="text" id="fatherName" placeholder="Enter father's name" required>
    </div>

    <div class="form-group">
      <label for="date">📅 Date of Admission</label>
      <input type="date" id="date" required>
    </div>

    <div class="form-group">
      <label for="admissionFees">💰 Admission Fees</label>
      <input type="number" id="admissionFees" placeholder="Enter admission fees" required>
    </div>

    <div class="form-group">
      <label for="totalFees">💵 Total Fees</label>
      <input type="number" id="totalFees" placeholder="Enter total fees" required>
    </div>

    <div class="form-group">
      <label for="phone">📱 Phone Number</label>
      <input type="tel" id="phone" placeholder="Enter phone number" required>
    </div>

    <button type="submit">Submit Admission</button>
  </form>

</body>
</html>
